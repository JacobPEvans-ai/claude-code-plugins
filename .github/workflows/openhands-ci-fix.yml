name: OpenHands CI Fix

# Started when CI Gate fails, and by the PR Reconcile sweep: one
# workflow_dispatch per head commit of a pull request whose code checks failed.
on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failure_run_id:
        description: ID of the failed run
        required: true
        type: string
      failure_head_branch:
        description: Head branch of the failed run
        required: true
        type: string

# The called workflow's jobs request exactly these scopes (fix commit, pull
# request comment through the issues API, run logs); a caller that grants
# less fails at graph validation.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    uses: JacobPEvans/.github-ai/.github/workflows/cc-ci-fix.yml@698b29fef056b6d1e6accde3186d200d5d2c9dfe # v2.56.0
    with:
      # Hosted runners cannot reach the model router; the review pool can.
      runner_label: review
      agent: openhands
      local_model: medium
      daily_run_limit: "20"
      ci_structure: "CI Gate (Markdown lint and file size checks, aggregated in Merge Gate); Validate Claude Code Plugin (manifest validation and plugin tests)"
      # Empty on workflow_run: the called workflow reads the failed run from the event.
      failure_conclusion: ${{ github.event_name == 'workflow_dispatch' && 'failure' || '' }}
      failure_run_id: ${{ inputs.failure_run_id }}
      failure_head_branch: ${{ inputs.failure_head_branch }}
      failure_head_repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || '' }}
      failure_actor: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
    secrets: inherit
